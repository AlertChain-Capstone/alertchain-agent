AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AlertChain backend starter with a health endpoint.

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Model identifier; use a Region-local model for managed projects without cross-Region inference.
  DynamoDBEndpointUrl:
    Type: String
    Default: ''
    Description: Optional container-reachable DynamoDB endpoint for local emulation; empty on AWS.
  BedrockEndpointUrl:
    Type: String
    Default: ''
    Description: Optional Bedrock endpoint (e.g. Floci's stub); empty means real Amazon Bedrock.
  BedrockAccessKeyId:
    Type: String
    Default: ''
    NoEcho: true
    Description: Local Floci only. Real AWS credentials used just for Bedrock calls; empty on AWS (the role is used).
  BedrockSecretAccessKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Local Floci only. See BedrockAccessKeyId.
  BedrockSessionToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Local Floci only. See BedrockAccessKeyId.
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:5173,http://127.0.0.1:5173'
    Description: Explicit frontend origins allowed to read the HTTP API; override for each environment.

Resources:
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alertchain-alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: alertCollection
          AttributeType: S
        - AttributeName: eventTimeAlertId
          AttributeType: S
        - AttributeName: principal
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: alertsByTime
          KeySchema:
            - AttributeName: alertCollection
              KeyType: HASH
            - AttributeName: eventTimeAlertId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: alertsByPrincipalAndTime
          KeySchema:
            - AttributeName: principal
              KeyType: HASH
            - AttributeName: eventTimeAlertId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  InvestigationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alertchain-investigations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: investigation_id
          AttributeType: S
      KeySchema:
        - AttributeName: investigation_id
          KeyType: HASH

  EvidenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alertchain-evidence
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evidence_id
          AttributeType: S
        - AttributeName: investigation_id
          AttributeType: S
      KeySchema:
        - AttributeName: evidence_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: evidenceByInvestigation
          KeySchema:
            - AttributeName: investigation_id
              KeyType: HASH
            - AttributeName: evidence_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alertchain-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: investigation_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: incidentsByInvestigation
          KeySchema:
            - AttributeName: investigation_id
              KeyType: HASH
            - AttributeName: incident_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 600

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /alertchain/backend
      RetentionInDays: 1

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackendLogStreams
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BackendLogGroup}:log-stream:*
        - PolicyName: StoreAlerts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AlertsTable.Arn
        - PolicyName: AgentReadAlerts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt AlertsTable.Arn
                  - !Sub ${AlertsTable.Arn}/index/alertsByPrincipalAndTime
        - PolicyName: AgentInvestigationStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt InvestigationsTable.Arn
                  - !GetAtt EvidenceTable.Arn
                  - !Sub ${EvidenceTable.Arn}/index/evidenceByInvestigation
                  - !GetAtt IncidentsTable.Arn
                  - !Sub ${IncidentsTable.Arn}/index/incidentsByInvestigation
        - PolicyName: ReadAlertPages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${AlertsTable.Arn}/index/alertsByTime
        - PolicyName: LookupAlertIncidentAssociation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: AgentInvokeBedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-micro-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-micro-v1:0
        - PolicyName: AgentSelfInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:alertchain-backend

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: alertchain-backend
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: backend/
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt BackendExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref BackendLogGroup
      Environment:
        Variables:
          ALERTS_TABLE_NAME: !Ref AlertsTable
          DYNAMODB_ENDPOINT_URL: !Ref DynamoDBEndpointUrl
          # Local Floci only (empty on AWS): the self-invoke call of an investigation run.
          LAMBDA_ENDPOINT_URL: !Ref DynamoDBEndpointUrl
          # Empty = real Amazon Bedrock. Locally, the BEDROCK_AWS_* credentials let the Floci
          # Lambda reach real Bedrock; on AWS they stay empty and the execution role is used.
          BEDROCK_ENDPOINT_URL: !Ref BedrockEndpointUrl
          BEDROCK_AWS_ACCESS_KEY_ID: !Ref BedrockAccessKeyId
          BEDROCK_AWS_SECRET_ACCESS_KEY: !Ref BedrockSecretAccessKey
          BEDROCK_AWS_SESSION_TOKEN: !Ref BedrockSessionToken
          INVESTIGATIONS_TABLE_NAME: !Ref InvestigationsTable
          EVIDENCE_TABLE_NAME: !Ref EvidenceTable
          INCIDENTS_TABLE_NAME: !Ref IncidentsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref AWS::Region
      Events:
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts
            Method: GET
        AlertDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{alertId}
            Method: GET
        AlertRawEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{alertId}/raw-event
            Method: GET
        AlertAssociatedIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{alertId}/associated-incident
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        IncidentList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: GET
        IncidentDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{incidentId}
            Method: GET
        IncidentQuestions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{incidentId}/questions
            Method: POST
        Investigations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /investigations
            Method: ANY
        InvestigationById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /investigations/{proxy+}
            Method: ANY

  GuardDutyFindingsRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      State: ENABLED
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
      Targets:
        - Id: AlertchainBackend
          Arn: !GetAtt BackendFunction.Arn

  GuardDutyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyFindingsRule.Arn

  SelectedCloudTrailRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        $or:
          - source:
              - aws.iam
            detail:
              eventSource:
                - iam.amazonaws.com
              eventName:
                - CreateAccessKey
          - source:
              - aws.cloudtrail
            detail:
              eventSource:
                - cloudtrail.amazonaws.com
              eventName:
                - StopLogging
      Targets:
        - Id: AlertchainBackend
          Arn: !GetAtt BackendFunction.Arn

  SelectedCloudTrailInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SelectedCloudTrailRule.Arn

Outputs:
  HealthUrl:
    Description: Health endpoint URL.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
